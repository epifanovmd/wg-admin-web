# SPA: неизвестные пути — index.html (маршруты решает клиент).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Файлы сборки с хешем в имени — навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html — всегда свежий: иначе после деплоя браузер ищет старые бандлы.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
